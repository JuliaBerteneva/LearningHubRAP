# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: myskills
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: http://us4.leverx.local:8000
        app:
          name: ZUL_MS_BSP
          description: My Skills
          package: ZUL_LEARNING_HUB
          transport: US4K902121
        exclude:
          - /test/
